{% load static %}
<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <title>新しいメモ-SmartMemo</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    
    <body>
        <div class="container mt-5">
            <h1 class="text-center mb-4">
                新しいメモ
            </h1>
            
            <form method="post">
                {% csrf_token%}

                {% if error %}
                <div class="alert alert-danger mt-3">
                    ⚠️ {{ error }}
                </div>
                {% endif %}
                
                <div class="mb-3">
                    <label class="form-label">
                        タイトル
                    </label>
                    <input type="text" name="title" class="form-control">
                 </div>

                 <!--カテゴリ-->
                 <div class="mb-3">
                    <label class="form-label">
                        カテゴリ
                    </label>
                    <select name="category" class="form-select">
                        <option value="">
                            --------
                        </option>
                        {% for category in categories %}
                        
                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>

                        {% endfor %}

                    </select>
                 </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            内容 (Markdown形式で記述可能)
                        </label>
                        <textarea id="memo-content" name="content" class="form-control" rows="6"></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            プレビュー
                        </label>
                        <div id="preview" class="border rounded p-3" style="height:375px; overflow-y:auto;"></div>
                    </div>
                </div>
                 
                 <button type="submit" class="btn btn-success">
                    保存
                </button>

                <a href="/" class="btn btn-secondary">
                    戻る
                </a>

            </form>
        </div>
        <!--javascript-->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/monokai.min.css">
        <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

        <script src="{% static 'js/markdown_editor.js' %}"></script>
    
    </body>
</html>
