{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}SmartMemo{% endblock %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">

        {% block extra_css %}
        {% endblock %}
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark" >
            
            <div class="container">
                <a class="navbar-brand" href="/">
                    SmartMemo
                </a>

                <div class="navbar-nav ms-5 me-3">
                    <a class="nav-link" href="{% url 'index' %}">HOME</a>

                    <a class="nav-link" href="{% url 'create' %}">NEW MEMO</a>

                    <a class="nav-link" href="{% url 'profile' %}">PROFILE</a>

                </div>
                
                 <form class="d-flex ms-auto" method="GET" action="/search/">
                    <input 
                       class="form-control me-2"
                       type="search"
                       name="keyword"
                       placeholder="検索">
                    
                    <button class="btn btn-outline-light" type="submit">
                        Search
                    </button>
                </form>
                
                <form action="{% url 'user_logout' %}" method="post" class="ms-3 mb-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light">
                        LOGOUT
                    </button>
                </form>
                

               
            </div>
        </nav>
            
        <main class="container mt-5">

            {% block content %}
            {% endblock %}
        </main>

         <!--フッター-->
        <footer class="smartmemo-footer">
        <div class="container">
            <p class="mb-0">
                © 2026 SmartMemo
            </p>
        </div>
    </footer>
    {% block extra_js %}
    {% endblock %}
    </body>
</html>
