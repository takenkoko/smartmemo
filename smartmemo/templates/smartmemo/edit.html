{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head lang="ja">
        <meta charset="UTF-8">
        <title>memo編集-SmartMemo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    
    <body>
        <div class="container mt-5 px-4">
            <h1 class="container mb-4">
                メモを編集
            </h1> 
            
            <form method="post">
                {%csrf_token%}

                <!--実行結果を送るための隠しフィールドを追加-->
                <input 
                    type="hidden" 
                    id="execution-output"
                    name="execution_output"
                    value="{{ memo.execution_output }}">

                <div class="mb-3">
                    <label class="form-label">タイトル</label>
                    <input type="text" name="title" value="{{memo.title}}" class="form-control">
                </div>

                <!--カテゴリ機能-->
                <div class="mb-3">
                    <label class="form-label">
                        カテゴリ
                    </label>

                    <select name="category" class="form-select">
                        <option value="">
                            --------
                        </option>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if memo.category and memo.category.id == category.id %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!--タグ機能-->
                <div class="mb-3">
                    <label class="form-label">
                        タグ
                    </label>
                    <input type="text" name="tags" class="form-control" value="{% for tag in memo.tags.all %}{{ tag.name}}{% if not forloop.last %},{% endif %}{% endfor %}" placeholder="例：django, python, debug">
                    <div class="form-text">
                        複数入力する場合は、カンマ(,)で区切ってください。
                    </div>
                </div>


                <div class="editor-preview-container">

                    <div class="editor-section">
                        <label class="form-label">内容(Markdown形式で記述可能)</label>
                        <!--editor-paneを追加-->
                        <textarea 
                        id="memo-content"
                        name="content" 
                        rows="6"
                        class="form-control editor-pane">{{memo.content}}</textarea>
                    </div>

                    <div class="resize-handle"></div>

                    <div class="preview-section">
                        <label class="form-label">プレビュー</label>
                        <div id="preview" class="border rounded p-3 editor-pane" style="overflow-y:auto;"></div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-secondary">
                    更新
                </button>
                <a href="/" class="btn btn-secondary">
                    戻る
                </a>
            </form>
        </div>


        <!--javascript-->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/monokai.min.css">
        <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
        
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

        <script src="{% static 'js/markdown_editor.js'%}"></script>
    </body>
</html>
